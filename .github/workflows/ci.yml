name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hisse
          POSTGRES_PASSWORD: hisse
          POSTGRES_DB: hisse_analizi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hisse -d hisse_analizi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,email]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q
        env:
          SKIP_NETWORK_TESTS: "1"

      - name: Alembic upgrade / downgrade / upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql://hisse:hisse@localhost:5432/hisse_analizi_test

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_PASSWORD=dummy ADMIN_API_KEY=dummy CORS_ORIGINS=http://localhost:3000 DOMAIN=example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  frontend:
    name: Frontend · Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Content & contract check
        run: npm run check:content

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test && npm run test:gates

      - name: Build
        run: npm run build
        env:
          API_URL: http://localhost:8000

      - name: Bundle budgets and iOS configuration
        run: npm run check:budgets && npm run check:ios

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Expo · TypeScript and iOS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npx expo config --type public > /dev/null
      - run: npx expo export --platform ios --output-dir dist
      - run: npm audit --omit=dev --audit-level=high

  ios:
    name: iOS · Expo and widget simulator builds
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo dependencies
        run: npm ci --prefix mobile
      - name: Generate Expo native app
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install iOS pods
        run: pod install --project-directory=mobile/ios
      - name: Compile primary Expo app
        run: xcodebuild -workspace mobile/ios/HisseAnalizi.xcworkspace -scheme HisseAnalizi -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/hisse-expo-build" CODE_SIGNING_ALLOWED=NO build
      - name: Check Expo privacy manifest
        run: test -f "$RUNNER_TEMP/hisse-expo-build/Build/Products/Debug-iphonesimulator/HisseAnalizi.app/PrivacyInfo.xcprivacy"
      - name: Shared Swift behavior
        run: |
          swiftc ios/Shared/WidgetModels.swift ios/Shared/CalendarReminderModel.swift ios/Shared/DeepLinkRouter.swift ios/Tests/verify_shared.swift -o "$RUNNER_TEMP/hisse-ios-tests"
          "$RUNNER_TEMP/hisse-ios-tests"
      - name: Compile app and widget
        run: xcodebuild -project ios/HisseAnalizi.xcodeproj -scheme HisseAnalizi -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/hisse-ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Check shipped privacy manifests
        run: |
          app="$RUNNER_TEMP/hisse-ios-build/Build/Products/Debug-iphonesimulator/HisseAnalizi.app"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/PlugIns/HisseAnaliziWidget.appex/PrivacyInfo.xcprivacy"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
