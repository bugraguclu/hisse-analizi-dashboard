name: Hata bildirimi
description: Tekrarlanabilir bir uygulama, API veya veri hatası bildirin.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Güvenlik açığı bildiriyorsanız bu formu kullanmayın; `SECURITY.md` içindeki özel bildirim sürecini izleyin.

  - type: dropdown
    id: area
    attributes:
      label: Etkilenen alan
      options:
        - Dashboard / kullanıcı arayüzü
        - Teknik analiz
        - Temel analiz / finansal tablolar
        - Piyasa verisi / tarama
        - Makro veriler
        - KAP / haber / worker
        - AI raporu
        - API / veritabanı / deployment
        - Diğer
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Sorun
      description: Ne oldu, ne olmasını bekliyordunuz?
      placeholder: Açık ve kısa bir açıklama yazın.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Yeniden üretme adımları
      placeholder: |
        1. ... sayfasını aç
        2. ... sembolünü ara
        3. ... bölümüne tıkla
        4. Hatayı gör
    validations:
      required: true

  - type: input
    id: ticker_period
    attributes:
      label: Sembol ve dönem
      description: Veri hatasıysa ticker, tarih/dönem ve mümkünse karşılaştırdığınız birincil kaynağı yazın.
      placeholder: THYAO, 2026/03, KAP bağlantısı

  - type: textarea
    id: environment
    attributes:
      label: Ortam
      description: Branch/commit, Docker veya yerel kurulum, tarayıcı ve işletim sistemi.
      placeholder: master@abc123, Docker Desktop, Chrome, macOS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Loglar veya ekran görüntüleri
      description: Secret ve kişisel verileri temizleyerek ilgili çıktı/ekran görüntüsünü ekleyin.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol
      options:
        - label: Aynı sorun için açık issue aradım.
          required: true
        - label: Paylaştığım içerikte secret veya kişisel veri bulunmuyor.
          required: true
