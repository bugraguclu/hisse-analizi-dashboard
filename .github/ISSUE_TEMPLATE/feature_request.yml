name: Özellik önerisi
description: Ürün veya geliştirici deneyimi için iyileştirme önerin.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Çözülecek ihtiyaç
      description: Hangi kullanıcı sorunu veya operasyonel ihtiyacı çözmek istiyorsunuz?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm
      description: Beklenen kullanıcı akışını, veri kaynağını veya API sözleşmesini açıklayın.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatifler ve kapsam dışı noktalar
      description: Değerlendirdiğiniz diğer yaklaşımlar veya bu isteğin özellikle kapsamadığı alanlar.

  - type: textarea
    id: data
    attributes:
      label: Veri doğruluğu ve kaynak
      description: Özellik finansal veri içeriyorsa birincil kaynak, yenilenme sıklığı ve hata davranışını belirtin.

  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol
      options:
        - label: Benzer bir özellik isteği aradım.
          required: true
        - label: Önerinin yatırım tavsiyesi üretmek yerine veri/karar desteği sunduğunu doğruladım.
          required: true
