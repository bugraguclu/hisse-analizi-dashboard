[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisse-analizi-dashboard"
version = "1.0.0"
description = "BIST Hisse Analizi Dashboard — teknik/temel analiz, makro veri, tarama ve bildirim sistemi"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bist", "borsa-istanbul", "fastapi", "nextjs", "fintech", "stock-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "borsapy>=0.10.2,<0.11",
    "yfinance>=0.2.35,<2.0",
    # Imported directly (src/adapters/{price,technical,index_adapter}.py) — was
    # previously only pulled in transitively via borsapy/yfinance.
    "pandas>=2.0.0",
    "structlog>=24.1.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
    "slowapi>=0.1.9",
    # Imported directly (src/core/config.py, src/api/limiter.py,
    # src/api/dependencies.py for rate-limit string parsing) — was previously
    # only pulled in transitively via slowapi.
    "limits>=3.0",
    # Imported directly (src/adapters/tradingview_chart.py) — was previously
    # only pulled in transitively via borsapy.
    "websocket-client>=1.9.0",
]

[project.optional-dependencies]
email = ["aiosmtplib>=3.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/bugraguclu/hisse-analizi-dashboard"
Repository = "https://github.com/bugraguclu/hisse-analizi-dashboard"
Documentation = "https://github.com/bugraguclu/hisse-analizi-dashboard#readme"
Changelog = "https://github.com/bugraguclu/hisse-analizi-dashboard/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services or fixtures",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# Third-party packages without type information (no py.typed / stubs).
[[tool.mypy.overrides]]
module = ["borsapy", "borsapy.*", "yfinance", "pandas", "aiosmtplib", "pytz", "dateutil"]
ignore_missing_imports = true
follow_imports = "skip"
