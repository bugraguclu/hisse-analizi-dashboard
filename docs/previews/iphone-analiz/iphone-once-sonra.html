  const root = document.documentElement;

      typeof nextState !== &quot;object&quot; ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

    postToHost(&quot;height&quot;, {

        ),
      ),

  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {

      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ha-iphone-comparison&#x27;);
  const labels = {tarama:&#x27;Seçilen tarama adından, filtrelenmiş hisse sonuçlarına.&#x27;,hisse:&#x27;Sekme ve gösterge adlarından, veriyle çalışan analiz ekranlarına.&#x27;,makro:&#x27;Sabit açıklamadan, tarihli göstergeler ve grafiklere.&#x27;};

  const presets = [{id:&#x27;low_pe&#x27;,name:&#x27;Düşük F/K&#x27;},{id:&#x27;low_pb&#x27;,name:&#x27;Düşük PD/DD&#x27;},{id:&#x27;high_dividend&#x27;,name:&#x27;Yüksek temettü&#x27;},{id:&#x27;high_roe&#x27;,name:&#x27;Yüksek ROE&#x27;},{id:&#x27;rsi_oversold&#x27;,name:&#x27;RSI aşırı satım&#x27;},{id:&#x27;uptrend&#x27;,name:&#x27;Yükseliş trendi&#x27;}];
  const stocks = [
    {ticker:&#x27;THYAO&#x27;,name:&#x27;Türk Hava Yolları&#x27;,price:300,change:1.2,pe:4.2,pb:.9,div:2,roe:26,rsi:46,trend:true},
    {ticker:&#x27;TUPRS&#x27;,name:&#x27;Tüpraş&#x27;,price:150,change:.8,pe:5.1,pb:1.2,div:9,roe:24,rsi:28,trend:true},
    {ticker:&#x27;EREGL&#x27;,name:&#x27;Ereğli Demir Çelik&#x27;,price:30,change:-.6,pe:6,pb:.8,div:7.5,roe:14,rsi:29,trend:false},
    {ticker:&#x27;AKBNK&#x27;,name:&#x27;Akbank&#x27;,price:60,change:1.8,pe:6.8,pb:1.1,div:6,roe:31,rsi:55,trend:true}
  ];
  let state = {screen:&#x27;tarama&#x27;,section:&#x27;teknik&#x27;,preset:&#x27;low_pe&#x27;,descending:false,ticker:&#x27;THYAO&#x27;,period:&#x27;1A&#x27;,sma:true,rsi:true};
  const money = n =&gt; n.toLocaleString(&#x27;tr-TR&#x27;,{minimumFractionDigits:2,maximumFractionDigits:2});

  function persist() {

  }
  function chooseScreen(screen,save=true) {
    if(![&#x27;tarama&#x27;,&#x27;hisse&#x27;,&#x27;makro&#x27;].includes(screen)) return;
    state.screen=screen;
    root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach(b=&gt;{const active=b.dataset.screen===screen;b.setAttribute(&#x27;aria-pressed&#x27;,String(active));b.classList.toggle(&#x27;btn-primary&#x27;,active);});

    if(screen===&#x27;tarama&#x27;) renderResults();
    if(screen===&#x27;hisse&#x27;) renderStock();
    if(save) persist();
  }
  function renderResults() {
    const preset=presets.find(p=&gt;p.id===state.preset)||presets[0];

    const field=state.preset===&#x27;low_pb&#x27;?&#x27;pb&#x27;:state.preset===&#x27;high_dividend&#x27;?&#x27;div&#x27;:state.preset===&#x27;high_roe&#x27;?&#x27;roe&#x27;:state.preset===&#x27;rsi_oversold&#x27;?&#x27;rsi&#x27;:state.preset===&#x27;uptrend&#x27;?&#x27;change&#x27;:&#x27;pe&#x27;;
    const column={pe:&#x27;F/K&#x27;,pb:&#x27;PD/DD&#x27;,div:&#x27;Verim&#x27;,roe:&#x27;ROE&#x27;,rsi:&#x27;RSI&#x27;,change:&#x27;Değişim&#x27;}[field];
    let list=stocks.filter(s=&gt;field===&#x27;div&#x27;?s.div&gt;=6:field===&#x27;roe&#x27;?s.roe&gt;=20:field===&#x27;rsi&#x27;?s.rsi&lt;30:field===&#x27;change&#x27;?s.trend:true);
    list.sort((a,b)=&gt;(a[field]-b[field])*(state.descending?-1:1));

    root.querySelector(&#x27;[data-results]&#x27;).innerHTML=list.map(s=&gt;`&lt;button class=&quot;ha-stock-row&quot; type=&quot;button&quot; data-stock=&quot;${s.ticker}&quot; aria-label=&quot;${s.ticker} örnek analizini aç&quot;&gt;&lt;span class=&quot;ha-column&quot;&gt;&lt;strong&gt;${s.ticker}&lt;/strong&gt;&lt;span class=&quot;ha-small ha-muted ha-number&quot;&gt;${money(s.price)} ₺&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ha-column&quot;&gt;&lt;span class=&quot;ha-number ${s.change&gt;=0?&#x27;ha-up&#x27;:&#x27;ha-down&#x27;}&quot;&gt;${s.change&gt;=0?&#x27;+&#x27;:&#x27;&#x27;}%${money(s.change)}&lt;/span&gt;&lt;svg class=&quot;ha-spark&quot; viewBox=&quot;0 0 55 19&quot; role=&quot;img&quot; aria-label=&quot;Temsilî fiyat eğilimi&quot;&gt;&lt;path class=&quot;ha-series&quot; d=&quot;M1 15 L9 12 L17 14 L25 7 L33 9 L42 4 L54 3&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;span class=&quot;ha-column ha-number&quot;&gt;${[&#x27;div&#x27;,&#x27;roe&#x27;,&#x27;change&#x27;].includes(field)?&#x27;%&#x27;:&#x27;&#x27;}${money(s[field])}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
  }
