[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is NOT configured here: alembic/env.py reads DATABASE_URL_SYNC from
# the environment / .env (same settings as the app). One-off override:
#   alembic -x dburl=postgresql://user:pass@host:5432/db upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
